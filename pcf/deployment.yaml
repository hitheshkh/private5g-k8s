apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-pcf
  namespace: open5gs
spec:
  replicas: 1
  selector: { matchLabels: { app: open5gs-pcf } }
  template:
    metadata: { labels: { app: open5gs-pcf } }
    spec:
      initContainers:
        - name: wait-nrf
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z open5gs-nrf 7777; do sleep 2; done"]
      containers:
        - name: pcf
          image: open5gs:v2.8.0
          imagePullPolicy: Never
          command: ["/opt/open5gs/bin/open5gs-pcfd"]
          args: ["-c", "/etc/open5gs/pcf.yaml"]
          ports: [{ containerPort: 7777 }]
          volumeMounts: [{ name: config, mountPath: /etc/open5gs }]
      volumes:
        - name: config
          configMap: { name: pcf-config }

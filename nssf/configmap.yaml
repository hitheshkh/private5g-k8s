apiVersion: v1
kind: ConfigMap
metadata:
  name: nssf-config
  namespace: open5gs
data:
  nssf.yaml: |
    logger:
      level: info
    nssf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
        client:
          scp:
            - uri: http://open5gs-scp:7777
          nrf:
            - uri: http://open5gs-nrf:7777
          nsi:
            - uri: http://open5gs-nrf:7777
              s_nssai:
                sst: 1
